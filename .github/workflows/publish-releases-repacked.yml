name: Publish v1-v8 releases from preserved sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-releases-repacked.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check lz4

      - name: Restore historical sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work dist

          for v in 1 2 3; do mkdir -p "work/v${v}"; done
          unzip -q versions/v1/Shrink_EldritchBlast6_Patch8_Source.zip -d work/v1
          unzip -q versions/v2/Shrink_EldritchBlast6_Patch8_v2_Source.zip -d work/v2
          unzip -q versions/v3/Shrink_EldritchBlastProgressive_Patch8_v3_Source.zip -d work/v3
          cp versions/v1/Shrink_EldritchBlast6_Patch8_Source.zip dist/
          cp versions/v2/Shrink_EldritchBlast6_Patch8_v2_Source.zip dist/
          cp versions/v3/Shrink_EldritchBlastProgressive_Patch8_v3_Source.zip dist/

          for v in 4 5; do
            cat .release-assets/source/v${v}/source.part-* > "dist/Manaweaver_v${v}_source.tar.xz"
            xz -t "dist/Manaweaver_v${v}_source.tar.xz"
            mkdir -p "work/v${v}"
            tar -xJf "dist/Manaweaver_v${v}_source.tar.xz" -C "work/v${v}"
          done

          for v in 6 7 8; do
            cat versions/v${v}/Manaweaver_v${v}_source.tar.xz.part-* > "dist/Manaweaver_v${v}_source.tar.xz"
            xz -t "dist/Manaweaver_v${v}_source.tar.xz"
            mkdir -p "work/v${v}"
            tar -xJf "dist/Manaweaver_v${v}_source.tar.xz" -C "work/v${v}"
          done

      - name: Build historical PAKs
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/build.py <<'PY'
          import os, struct, xml.etree.ElementTree as ET
          import lz4.block

          def write_loca(xml_path, out_path, v7_bug=False):
              root = ET.parse(xml_path).getroot()
              entries=[]
              for n in root.findall('content'):
                  entries.append((n.attrib['contentuid'], int(n.attrib.get('version','1')), n.text or ''))
              # v7 historically used a wrong 74-byte stride only in TextsOffset.
              text_offset = 12 + (74 if v7_bug else 70) * len(entries)
              out=bytearray(struct.pack('<III',0x41434F4C,len(entries),text_offset))
              for key,ver,text in entries:
                  kb=key.encode('utf-8')
                  out += kb + b'\0'*(64-len(kb))
                  out += struct.pack('<HI',ver,len(text.encode('utf-8'))+1)
              for _,_,text in entries:
                  out += text.encode('utf-8')+b'\0'
              os.makedirs(os.path.dirname(out_path),exist_ok=True)
              open(out_path,'wb').write(out)

          def restore_loca(root, version):
              for base,_,names in os.walk(root):
                  for name in names:
                      if name.endswith('.loca.xml'):
                          p=os.path.join(base,name)
                          write_loca(p,p[:-4],version==7)

          def files(root):
              out=[]
              for base,dirs,names in os.walk(root):
                  dirs.sort(); names.sort()
                  for name in names:
                      rel=os.path.relpath(os.path.join(base,name),root).replace(os.sep,'/')
                      if rel=='README.md' or rel.endswith('.loca.xml'): continue
                      out.append(rel)
              return sorted(out)

          def pak(root,outfile):
              data=bytearray(b'LSPK'+b'\0'*36); ents=[]
              for rel in files(root):
                  payload=open(os.path.join(root,*rel.split('/')),'rb').read()
                  off=len(data); data+=payload
                  nb=rel.encode(); name=nb+b'\0'*(256-len(nb))
                  ents.append(name+struct.pack('<I H B B I I',off&0xffffffff,(off>>32)&0xffff,0,0,len(payload),0))
              raw=b''.join(ents)
              comp=lz4.block.compress(raw,store_size=False)
              flo=len(data)
              fl=struct.pack('<II',len(ents),len(comp))+comp
              data+=fl
              data[4:40]=struct.pack('<I Q I B B 16s H',18,flo,len(fl),0,0,b'\0'*16,1)
              open(outfile,'wb').write(data)

          roots={
            1:'work/v1/Shrink_EldritchBlast6_Patch8',2:'work/v2',3:'work/v3',4:'work/v4',
            5:'work/v5',6:'work/v6',7:'work/v7',8:'work/v8'}
          outputs={
            1:'dist/Shrink_EldritchBlast6_Patch8.pak',
            2:'dist/Shrink_EldritchBlast6_Patch8_v2.pak',
            3:'dist/Shrink_EldritchBlastProgressive_Patch8_v3.pak',
            4:'dist/Shrink_EldritchBlastSpecialization_Patch8_v4.pak',
            5:'dist/Shrink_EldritchSorcerer_Patch8_v5.pak',
            6:'dist/Shrink_EldritchSorcerer_Patch8_v6.pak',
            7:'dist/Shrink_EldritchSorcerer_Patch8_v7.pak',
            8:'dist/Shrink_EldritchSorcerer_Patch8_v8.pak'}
          for v in (6,7,8): restore_loca(roots[v],v)
          for v in range(1,9): pak(roots[v],outputs[v])
          PY
          python /tmp/build.py

      - name: Validate generated packages
        shell: bash
        run: |
          set -euo pipefail
          # v1-v3 are known byte-exact historical packages.
          echo 'd5d17a191e3fe4ffd4913e09797b5623d1f45023dc3d988725ce834f328b198b  dist/Shrink_EldritchBlast6_Patch8.pak' | sha256sum -c -
          echo 'f027ac66ac0804c1012d13c1d6125f3b7b82257463f479915cca9b15cfc6e43c  dist/Shrink_EldritchBlast6_Patch8_v2.pak' | sha256sum -c -
          echo '0ecaf9b86a213c5867f658e7d23c57b957d0ed463a7f6f99aa63065b4c8be747  dist/Shrink_EldritchBlastProgressive_Patch8_v3.pak' | sha256sum -c -

          python - <<'PY'
          import glob,struct,sys
          for p in sorted(glob.glob('dist/*.pak')):
              b=open(p,'rb').read()
              assert b[:4]==b'LSPK',p
              ver, flo, flsize = struct.unpack_from('<IQI',b,4)
              assert ver==18,p
              assert 40 <= flo < len(b),p
              assert flo+flsize <= len(b),p
              print('validated',p,len(b))
          PY

      - name: Publish v1-v8
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pub(){
            tag="$1"; target="$2"; title="$3"; pak="$4"; src="$5"; note=".release-assets/notes/${tag}.md"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "dist/$pak" "dist/$src" --clobber
              gh release edit "$tag" --title "$title" --notes-file "$note"
            else
              gh release create "$tag" "dist/$pak" "dist/$src" --target "$target" --title "$title" --notes-file "$note"
            fi
          }
          pub v1 06f8c35f14371025d9811b66499ed9b831b41e45 'v1 — Eldritch Blast Prototype / 魔能爆原型' Shrink_EldritchBlast6_Patch8.pak Shrink_EldritchBlast6_Patch8_Source.zip
          pub v2 0f4726cb80e3fb78094444916bfd0657b13d8121 'v2 — Runtime Six-Beam Blast / 运行时六束魔爆' Shrink_EldritchBlast6_Patch8_v2.pak Shrink_EldritchBlast6_Patch8_v2_Source.zip
          pub v3 cc6455b24be9510affb6a21b5ecca5b24e798332 'v3 — Progressive Eldritch Blast / 渐进魔能爆' Shrink_EldritchBlastProgressive_Patch8_v3.pak Shrink_EldritchBlastProgressive_Patch8_v3_Source.zip
          pub v4 d1e60fa3ba475ba79a29a231b5e0d23de45bc83d 'v4 — Eldritch Blast Specialization / 魔爆专精' Shrink_EldritchBlastSpecialization_Patch8_v4.pak Manaweaver_v4_source.tar.xz
          pub v5 66ee453de6628500531eb1ab77627822ffb79483 'v5 — Manaweaver Subclass / 魔能术士子职业' Shrink_EldritchSorcerer_Patch8_v5.pak Manaweaver_v5_source.tar.xz
          pub v6 9b4960daac3920e3dee6f3c886f6d863537b658b 'v6 — Manaweaver Progression Rework / 魔能术士成长重构' Shrink_EldritchSorcerer_Patch8_v6.pak Manaweaver_v6_source.tar.xz
          pub v7 2cdafee5d76b5fb44f34f604cdf268a81b4b1191 'v7 — Custom Spellbook Expansion / 专属法表扩展' Shrink_EldritchSorcerer_Patch8_v7.pak Manaweaver_v7_source.tar.xz
          pub v8 3b0de858a8351aeee3020654e0200471fdd67b01 'v8 — Manaweaver Patch 8 / 魔能术士 Patch 8' Shrink_EldritchSorcerer_Patch8_v8.pak Manaweaver_v8_source.tar.xz

          V7=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v7" --jq .id)
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${V7}" -F prerelease=true >/dev/null
          V8=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v8" --jq .id)
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${V8}" -f make_latest=true >/dev/null
          gh release list --limit 20
